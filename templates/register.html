{% extends 'base.html' %}

{% block title %}Register - Local Mail System{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <h2>Create Account</h2>
    <p class="subtitle">Register to send and receive local emails</p>

    <form method="POST" action="{{ url_for('register') }}">
        <div class="form-group">
            <label for="username">Choose a Username</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="e.g. anu or anu@localmail.com" required autofocus>
            <small>Your local email address will be username@localmail.com.</small>
        </div>

        <div class="form-group">
            <label for="password">Create a Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-primary">Register</button>
    </form>

    <div class="auth-footer">
        Already registered? <a href="{{ url_for('login') }}">Sign In</a>
    </div>
</div>
{% endblock %}
