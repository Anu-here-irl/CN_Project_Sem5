{% extends 'base.html' %}

{% block title %}Login - Local Mail System{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <h2>Welcome Back</h2>
    <p class="subtitle">Log in to your local mail account</p>

    <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="e.g. alice or alice@localmail.com" required autofocus>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-primary">Sign In</button>
    </form>

    <div class="auth-footer">
        Don't have an account? <a href="{{ url_for('register') }}">Create one</a>
    </div>
</div>
{% endblock %}
